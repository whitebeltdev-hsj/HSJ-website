# Schedule sync: reads the gym's Google Calendar feed (the SCHEDULE_ICS_URL
# repository secret) every 20 minutes and updates the published schedule when
# it changed. The calendar is the source of truth: any event title publishes,
# and a class nobody has seen before is classified from its own words rather
# than refused (REQ-087). One guard is left, a week that shrank by half or
# more, which is what a mid-edit or wrong-calendar state looks like; it holds
# the publish and opens an issue labeled schedule-sync, and a manual run with
# allow_shrink accepts an intentionally smaller week. Note: GitHub pauses cron workflows after 60
# days without repository activity; the Actions tab shows a re-enable banner
# if that ever happens.
name: Schedule sync
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "Publish even if the schedule shrank by half or more"
        type: boolean
        default: false
concurrency:
  group: schedule-sync
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
  pages: write
  actions: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: pip install --quiet icalendar==6.1.1 recurring-ical-events==3.3.4
      # until the owner seals the SCHEDULE_ICS_URL secret, every run is a
      # clean no-op instead of a failure parade
      - name: Check configuration
        id: config
        env:
          HAS_SECRET: ${{ secrets.SCHEDULE_ICS_URL != '' }}
        run: |
          echo "ready=$HAS_SECRET" >> "$GITHUB_OUTPUT"
          if [ "$HAS_SECRET" != "true" ]; then
            # A green tick on a run that did nothing is how this went unnoticed
            # for months: the client reported the schedule was not syncing while
            # every scheduled run reported success. The run stays green, because
            # a missing secret is a configuration state and not a build failure,
            # but it is now annotated and summarised so the Actions tab shows it.
            echo "::warning title=Schedule sync is not configured::SCHEDULE_ICS_URL is not set, so this run published nothing. Add the calendar's secret iCal address under Settings, Secrets and variables, Actions."
            {
              echo "### Schedule sync did nothing"
              echo
              echo "\`SCHEDULE_ICS_URL\` is not set, so the sync had no calendar to read."
              echo "Every run will keep reporting success and publishing nothing until it is."
              echo
              echo "Fix: Google Calendar, Settings for the gym's calendar, *Secret address in iCal format*,"
              echo "then paste it into this repository under Settings, Secrets and variables, Actions,"
              echo "as \`SCHEDULE_ICS_URL\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Sync schedule from calendar
        if: steps.config.outputs.ready == 'true'
        id: sync
        env:
          SCHEDULE_ICS_URL: ${{ secrets.SCHEDULE_ICS_URL }}
        run: |
          set +e
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.allow_shrink }}" = "true" ]; then
            EXTRA="--allow-shrink"
          fi
          python scripts/schedule_sync.py $EXTRA --report sync-report.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Commit and deploy the new schedule
        if: steps.sync.outputs.code == '0' && steps.sync.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "schedule-sync[bot]"
          git config user.email "schedule-sync[bot]@users.noreply.github.com"
          git add schedule/index.html free-trial/index.html calendar/
          git commit -m "chore(schedule): calendar sync $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
          # a push made with the workflow token never starts another workflow,
          # so ask the Pages deploy (REQ-107, .github/workflows/pages.yml) to
          # run explicitly; the old branch build request stays for a repo whose
          # Pages source is still the branch
          gh workflow run pages.yml --ref main || true
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
      - name: Show what the sync read from the calendar
        if: always() && steps.sync.outcome != 'skipped'
        run: |
          # Every run says what it made of the week. A class name nobody has
          # seen before is published, not refused (REQ-087), so this is a
          # record rather than a request: the summary is where you check the
          # sync's reading of a new class, and nothing waits on you.
          if [ -s sync-report.md ]; then
            { echo "### Schedule sync"; echo; cat sync-report.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Schedule sync: no change this run" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Report a held publish as an issue
        if: steps.sync.outputs.code == '3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create schedule-sync --color B45309 \
            --description "The class schedule sync needs a human" --force
          TITLE="Schedule sync held: the week looks much smaller than usual"
          OPEN=$(gh issue list --label schedule-sync --state open --json number --jq '.[0].number')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body-file sync-report.md
          else
            gh issue create --title "$TITLE" --label schedule-sync --body-file sync-report.md
          fi
      - name: Alert after three straight fetch failures
        if: steps.sync.outputs.code == '4'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRIOR=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/schedule-sync.yml/runs?event=schedule&status=completed&per_page=2" \
            --jq '[.workflow_runs[].conclusion] | map(select(. == "failure")) | length')
          if [ "$PRIOR" = "2" ]; then
            gh label create schedule-sync --color B45309 \
              --description "The class schedule sync needs a human" --force
            OPEN=$(gh issue list --label schedule-sync --state open --json number --jq '.[0].number')
            if [ -n "$OPEN" ]; then
              gh issue comment "$OPEN" --body-file sync-report.md
            else
              gh issue create --title "Schedule sync cannot reach the calendar" \
                --label schedule-sync --body-file sync-report.md
            fi
          fi
          exit 1
